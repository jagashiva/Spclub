<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPORTX Contact</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      overflow-x:hidden;
    }

    /* NAVBAR */

    header{
      width:100%;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:fixed;
      top:0;
      left:0;
      z-index:1000;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(10px);
    }

    .logo{
      font-size:30px;
      font-weight:bold;
      color:#00e5ff;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:25px;
      font-size:18px;
      transition:0.3s;
    }

    nav a:hover{
      color:#00e5ff;
    }

    /* CONTACT SECTION */

    .contact-section{
      width:100%;
      min-height:100vh;
      padding:140px 8% 80px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .contact-container{
      width:100%;
      max-width:700px;
      background:#111827;
      padding:45px;
      border-radius:25px;
      box-shadow:0 0 30px rgba(0,229,255,0.15);
      animation:zoomIn 1s ease;
    }

    .title{
      text-align:center;
      font-size:50px;
      margin-bottom:15px;
      color:#00e5ff;
    }

    .subtitle{
      text-align:center;
      color:#d1d5db;
      margin-bottom:40px;
      font-size:17px;
    }

    .input-box{
      margin-bottom:25px;
    }

    .input-box label{
      display:block;
      margin-bottom:10px;
      color:#00e5ff;
      font-size:17px;
    }

    .input-box input,
    .input-box textarea,
    .input-box select{
      width:100%;
      padding:15px;
      border:none;
      outline:none;
      border-radius:12px;
      background:#1f2937;
      color:white;
      font-size:16px;
      transition:0.3s;
    }

    .input-box input:focus,
    .input-box textarea:focus,
    .input-box select:focus{
      box-shadow:0 0 15px rgba(0,229,255,0.5);
    }

    .input-box textarea{
      resize:none;
      height:140px;
    }

    .submit-btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:40px;
      background:#00e5ff;
      color:black;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.4s;
    }

    .submit-btn:hover{
      transform:scale(1.03);
      box-shadow:0 0 25px #00e5ff;
    }

    /* ANIMATION */

    @keyframes zoomIn{
      from{
        opacity:0;
        transform:scale(0.7);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    /* RESPONSIVE */

    @media(max-width:900px){

      header{
        flex-direction:column;
        gap:15px;
      }

      nav{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
      }

      .title{
        font-size:38px;
      }

      .contact-container{
        padding:30px;
      }

    }

  </style>

</head>

<body>

  <!-- NAVBAR -->

  <header>

    <div class="logo">VANS SPORTS CLUB</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="spclubabout.html">About</a>
      <a href="spclubteams.html">Teams</a>
      <a href="spclubgallery.html">Gallery</a>
      <a href="spclubcontact.html">Contact</a>
    </nav>

  </header>

  <!-- CONTACT FORM -->

  <section class="contact-section">

    <div class="contact-container">

      <h1 class="title">Register Now</h1>

      <p class="subtitle">
        Join VANS SPORTS CLUB and become part of our professional sports community.
      </p>

      <form>

        <div class="input-box">
          <label>Full Name</label>
          <input type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-box">
          <label>Email Address</label>
          <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-box">
          <label>Phone Number</label>
          <input type="tel" placeholder="Enter your phone number" required>
        </div>

        <div class="input-box">
          <label>Select Sport</label>

          <select required>
            <option value="">Choose Your Sport</option>
            <option>SILAMBAM</option>
            <option>AMETURE BOXING</option>
            <option>KICK BOXING</option>
            <option>FITNESS TRAINING</option>
          </select>

        </div>

        <div class="input-box">
          <label>Your Message</label>

          <textarea placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit" class="submit-btn">
          Submit Registration
        </button>

      </form>

    </div>

  </section>

</body>
</html>
